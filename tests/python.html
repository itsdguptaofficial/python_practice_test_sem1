<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Revision Test</title><style>
:root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#58647a;--accent:#5149c8;--line:#d5dbea;--good:#086b43;--bad:#a52820;--soft:#e8eaff;--shadow:#17203312}html[data-theme="dark"]{color-scheme:dark;--bg:#10131c;--card:#1b2030;--text:#eef1fa;--muted:#c0c8d8;--accent:#b6b1ff;--line:#3b455b;--good:#7de0ad;--bad:#ff9a93;--soft:#302f58;--shadow:#0005}html:not([data-theme="light"]):not([data-theme="dark"]){color-scheme:light dark}@media(prefers-color-scheme:dark){html:not([data-theme="light"]):not([data-theme="dark"]){--bg:#10131c;--card:#1b2030;--text:#eef1fa;--muted:#c0c8d8;--accent:#b6b1ff;--line:#3b455b;--good:#7de0ad;--bad:#ff9a93;--soft:#302f58;--shadow:#0005}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}main{max-width:900px;margin:28px auto;padding:0 18px}a{color:var(--accent)}button,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}button:hover,a.button:hover{filter:brightness(.94)}:focus-visible{outline:3px solid #f0a500;outline-offset:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:23px;margin:16px 0;box-shadow:0 8px 26px var(--shadow)}header,.toolbar,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:var(--muted)}.tag{color:var(--accent);font-weight:700}.pill{display:inline-block;border-radius:99px;background:var(--soft);color:var(--accent);padding:2px 10px;font-size:.83rem;font-weight:650;margin-left:7px}.primary,.button{background:var(--accent);color:white;border:0}.option{display:block;width:100%;text-align:left;margin:9px 0}.option.chosen{outline:2px solid var(--accent);background:var(--soft)}pre{white-space:pre-wrap;overflow:auto;background:var(--bg);padding:15px;border-radius:10px;font-size:.92em}progress{width:100%;height:12px;accent-color:var(--accent)}.dots{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.dot{padding:5px 9px;min-width:36px}.dot.answered{border-color:var(--good)}.dot.current{background:var(--accent);color:white}.warning{background:#fff2ce;color:#543d00;padding:9px 12px;border-radius:9px}.error{color:var(--bad);font-weight:650}details{border-top:1px solid var(--line);padding:12px 0}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.scroll{overflow:auto}.small{font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:12px}.stat b{display:block;font-size:1.35rem}.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}svg{max-width:100%;height:auto}.hide{display:none}.spacer{height:4px}@media(max-width:600px){main{margin:14px auto}.card{padding:17px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:flex-start}}
</style></head><body><main><header><a href="../index.html">← Back to all tests</a><span class="muted" id="roundLabel"></span></header><div class="toolbar"><label>Theme <select id="theme" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><span class="row"><button id="export">Export data</button><button id="import">Import data</button><input id="file" type="file" accept="application/json" hidden></span></div><p id="notice" class="warning hide" role="status"></p><section id="view"></section></main>
<script src="../questions/python-bank.js"></script><script>
(()=>{'use strict';const KEY='mcq-python-progress',SETKEY='mcq-shared-settings',VERSION=2,BANK=window.PYTHON_BANK||[],TOPICS=[...new Set(BANK.map(q=>q.t))];let storageOK=true,mem={version:VERSION,activeSession:null,history:[]},settings={theme:'system'};const view=document.querySelector('#view'),notice=document.querySelector('#notice'),label=document.querySelector('#roundLabel');
function read(key){try{return localStorage.getItem(key)}catch{storageOK=false;return null}}function write(key,val){try{localStorage.setItem(key,val)}catch{storageOK=false;warn('Browser storage is unavailable; progress will stay in memory for this tab.')}}function warn(msg){notice.textContent=msg;notice.classList.remove('hide')}function load(){let raw=read(KEY);if(raw){try{const x=JSON.parse(raw);if(x&&x.version===VERSION){mem={version:VERSION,activeSession:validSession(x.activeSession),history:Array.isArray(x.history)?x.history.map(validSession).filter(Boolean):[]}}else mem=migrate(x)}catch{warn('Saved progress could not be read. A fresh in-memory test is ready.')}}let sr=read(SETKEY);if(sr){try{let s=JSON.parse(sr);if(['system','light','dark'].includes(s.theme))settings=s}catch{}}applyTheme();if(!storageOK)warn('Browser storage is unavailable; progress will stay in memory for this tab.')}function validSession(s){if(!s||typeof s!=='object'||!Array.isArray(s.rounds))return null;const rounds=s.rounds.filter(r=>r&&typeof r==='object'&&Array.isArray(r.answers)).map(r=>({...r,answers:r.answers.filter(a=>a&&typeof a==='object')}));if(s.pendingRound&&(!Array.isArray(s.pendingRound.questions)||!s.pendingRound.questions.every(q=>q&&q.id&&Array.isArray(q.o)&&q.o.length===4)))return null;const ids=new Set(Array.isArray(s.usedQuestionIds)?s.usedQuestionIds.filter(x=>typeof x==='string'):[]);for(const r of rounds)for(const a of r.answers)if(a.id)ids.add(a.id);if(s.pendingRound)for(const q of s.pendingRound.questions)ids.add(q.id);return {...s,rounds,usedQuestionIds:[...ids]}}function migrate(x){if(!x||typeof x!=='object')return {version:VERSION,activeSession:null,history:[]};if(x.activeSession&&Array.isArray(x.history))return {version:VERSION,activeSession:validSession(x.activeSession),history:x.history.map(validSession).filter(Boolean)};if(Array.isArray(x.rounds)){let rounds=x.rounds.filter(r=>r&&typeof r==='object').map(r=>({score:Number(r.score)||0,startedAt:null,endedAt:null,answers:Array.isArray(r.answers)?r.answers.map(a=>({id:a.id||null,topic:a.topic||null,correct:!!a.ok,changedCount:0,answeredAt:null,question:a.q||'',correctAnswer:a.correct||'',explanation:a.explanation||''})):[]}));return {version:VERSION,activeSession:null,history:[{id:'legacy-'+Date.now(),startedAt:null,endedAt:null,rounds,usedQuestionIds:[]}]}}return {version:VERSION,activeSession:null,history:[]}}function save(){mem.version=VERSION;write(KEY,JSON.stringify(mem))}function applyTheme(){document.documentElement.dataset.theme=settings.theme;let s=document.querySelector('#theme');if(s)s.value=settings.theme}function setTheme(v){settings.theme=v;write(SETKEY,JSON.stringify(settings));applyTheme()}document.querySelector('#theme').onchange=e=>setTheme(e.target.value);
function download(){const blob=new Blob([JSON.stringify({version:VERSION,activeSession:mem.activeSession,history:mem.history,settings},null,2)],{type:'application/json'}),a=document.createElement('a'),d=new Date().toISOString().slice(0,10);a.href=URL.createObjectURL(blob);a.download=`python-progress-${d}.json`;a.click();URL.revokeObjectURL(a.href)}document.querySelector('#export').onclick=download;document.querySelector('#import').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(x.version!==VERSION||!Array.isArray(x.history)||!(x.activeSession===null||validSession(x.activeSession))||!x.settings||!['system','light','dark'].includes(x.settings.theme))throw Error('This file is not a valid Python progress export (version 2).');const choice=prompt('Import data: type MERGE to combine it with current data, or REPLACE to replace current data. Cancel to keep current data.');if(!choice)return;if(choice.toUpperCase()==='MERGE'){mem.history.push(...x.history);if(x.activeSession)mem.activeSession=x.activeSession;settings=x.settings}else if(choice.toUpperCase()==='REPLACE'){mem={version:VERSION,activeSession:x.activeSession,history:x.history};settings=x.settings}else throw Error('Enter MERGE or REPLACE.');write(SETKEY,JSON.stringify(settings));save();applyTheme();renderHome()}catch(err){warn(err.message||'Could not import that file.')}e.target.value=''};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeId(){return 's-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}function startSession(){mem.activeSession={id:makeId(),startedAt:new Date().toISOString(),endedAt:null,rounds:[],usedQuestionIds:[],pendingRound:null,weakTopics:[]};scheduleRound(true);save();renderQuiz()}function makeRound(first=false){const unused=BANK.filter(q=>!mem.activeSession.usedQuestionIds.includes(q.id));let chosen=[];if(first){for(const t of TOPICS){const q=shuffle(unused.filter(x=>x.t===t))[0];if(q&&!chosen.includes(q))chosen.push(q)}chosen=chosen.concat(shuffle(unused.filter(q=>!chosen.includes(q))).slice(0,Math.max(0,20-chosen.length)))}else{const weak=mem.activeSession.weakTopics||[],focus=unused.filter(q=>weak.includes(q.t)),known=unused.filter(q=>!weak.includes(q.t));chosen=shuffle(focus).slice(0,Math.min(14,focus.length));chosen=chosen.concat(shuffle(known).slice(0,20-chosen.length));if(chosen.length<20)chosen=chosen.concat(shuffle(unused.filter(q=>!chosen.includes(q))).slice(0,20-chosen.length))}return chosen.map(q=>{const pairs=shuffle(q.o.map((v,i)=>({v,ok:i===q.a})));return {id:q.id,t:q.t,q:q.q,c:q.c||null,o:pairs.map(p=>p.v),a:pairs.findIndex(p=>p.ok),choice:null,changes:0,answeredAt:null,e:q.e}})}function scheduleRound(first=false){let s=mem.activeSession,qs=makeRound(first);if(!qs.length){finishSession(true);return}const now=new Date().toISOString();s.pendingRound={startedAt:now,endedAt:null,index:0,questions:qs};s.usedQuestionIds.push(...qs.map(q=>q.id));save()}function renderQuiz(){let s=mem.activeSession;if(!s){renderHome();return}if(!s.pendingRound){label.textContent='';view.innerHTML=`<section class="card"><h1>Python Revision Test</h1><p>Session in progress. ${s.rounds.length} round(s) submitted.</p><button class="primary" id="resume">Resume session</button> <button id="finish">I'm satisfied / finish</button></section>`;document.querySelector('#resume').onclick=()=>{scheduleRound(s.rounds.length===0);renderQuiz()};document.querySelector('#finish').onclick=()=>finishSession(false);return}renderQuestion()}
function renderQuestion(){let s=mem.activeSession,r=s.pendingRound,i=r.index,q=r.questions[i],n=r.questions.length;label.textContent=`Round ${s.rounds.length+1}`;const selected=q.choice!==null,ansClass=selected?'chosen':'';view.innerHTML=`<section class="card"><div class="row"><b>Question ${i+1} of ${n}</b><span class="pill">${esc(q.t)}</span><span class="muted">${r.questions.filter(x=>x.choice!==null).length} answered</span></div><progress max="${n}" value="${i+1}"></progress><nav class="dots" aria-label="Question navigation">${r.questions.map((x,k)=>`<button class="dot ${x.choice!==null?'answered':''} ${k===i?'current':''}" aria-label="Question ${k+1}, ${x.choice===null?'unanswered':'answered'}${k===i?', current':''}" data-dot="${k}">${k+1}</button>`).join('')}</nav><h2>${esc(q.q).replace(/\n/g,'<br>')}</h2>${q.c?`<pre><code>${esc(q.c)}</code></pre>`:''}<div>${q.o.map((o,k)=>`<button class="option ${q.choice===k?ansClass:''}" data-answer="${k}">${'ABCD'[k]}. ${esc(o)}</button>`).join('')}</div><div id="feedback">${selected?`<p><b>${q.choice===q.a?'Selected answer is correct.':'Selected answer is incorrect.'}</b> ${esc(q.e)}</p>`:''}</div><div class="row"><button id="prev" ${i===0?'disabled':''}>← Previous</button><button id="next" ${i===n-1?'disabled':''}>Next →</button><button class="primary" id="finish">Finish session</button><button id="submit" ${r.questions.some(x=>x.choice===null)?'disabled':''}>Submit round</button></div></section>`;
document.querySelectorAll('[data-dot]').forEach(b=>b.onclick=()=>navigate(+b.dataset.dot));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>choose(+b.dataset.answer));document.querySelector('#prev').onclick=()=>navigate(i-1);document.querySelector('#next').onclick=()=>navigate(i+1);document.querySelector('#submit').onclick=submitRound;document.querySelector('#finish').onclick=()=>finishSession(false);window.onkeydown=e=>{if(e.key==='ArrowLeft')navigate(Math.max(0,mem.activeSession.pendingRound.index-1));else if(e.key==='ArrowRight')navigate(Math.min(mem.activeSession.pendingRound.questions.length-1,mem.activeSession.pendingRound.index+1));else if('1234'.includes(e.key))choose(+e.key-1);else if(/^[a-d]$/i.test(e.key))choose(e.key.toUpperCase().charCodeAt(0)-65);else if(e.key==='Enter'&&mem.activeSession.pendingRound.index<mem.activeSession.pendingRound.questions.length-1)navigate(mem.activeSession.pendingRound.index+1)}}
function choose(n){let s=mem.activeSession,r=s.pendingRound,q=r.questions[r.index];if(q.choice!==n){if(q.choice!==null)q.changes++;q.choice=n;q.answeredAt=new Date().toISOString()}save();renderQuestion()}function navigate(i){let r=mem.activeSession?.pendingRound;if(!r||i<0||i>=r.questions.length)return;r.index=i;save();renderQuestion()}
function submitRound(){let s=mem.activeSession,r=s.pendingRound;if(r.questions.some(q=>q.choice===null))return;const ended=new Date().toISOString(),answers=r.questions.map(q=>({id:q.id,topic:q.t,correct:q.choice===q.a,changedCount:q.changes,answeredAt:q.answeredAt,question:q.q,selectedAnswer:q.o[q.choice],correctAnswer:q.o[q.a],explanation:q.e})),score=answers.filter(a=>a.correct).length,topics={};for(const a of answers){topics[a.topic]??={correct:0,total:0};topics[a.topic].total++;if(a.correct)topics[a.topic].correct++}r.endedAt=ended;const round={startedAt:r.startedAt,endedAt:ended,score,answers,topics};s.rounds.push(round);s.weakTopics=[...new Set(answers.filter(a=>!a.correct).map(a=>a.topic))];s.pendingRound=null;save();const left=BANK.length-s.usedQuestionIds.length;if(left===0){finishSession(true,round)}else showRoundResult(round,left)}function showRoundResult(round,left){label.textContent=`Round ${mem.activeSession.rounds.length}`;const topicRows=Object.entries(round.topics).map(([t,x])=>`<li>${esc(t)}: ${x.correct}/${x.total}</li>`).join(''),wrong=round.answers.filter(a=>!a.correct).map(a=>`<li><b>${esc(a.topic)}:</b> ${esc(a.question)}<br>Correct: ${esc(a.correctAnswer)}. ${esc(a.explanation)}</li>`).join('')||'<li>None — perfect round.</li>';view.innerHTML=`<section class="card"><h1>Round ${mem.activeSession.rounds.length} results</h1><h2>${round.score} / ${round.answers.length} · ${Math.round(round.score/round.answers.length*100)}%</h2><h3>Topic breakdown</h3><ul>${topicRows}</ul><h3>Missed questions</h3><ol>${wrong}</ol><p>${left} unused questions remain in the bank.</p><button class="primary" id="nextRound">${left<20?'Start final shorter round':'Start next round'}</button> <button id="finish">I'm satisfied / finish</button></section>`;document.querySelector('#nextRound').onclick=()=>{scheduleRound(false);renderQuiz()};document.querySelector('#finish').onclick=()=>finishSession(false)}function finishSession(depleted=false,lastRound=null){let s=mem.activeSession;if(!s)return;const now=new Date().toISOString();s.endedAt=now;if(s.pendingRound){s.pendingRound=null}mem.history.push(s);mem.activeSession=null;save();showSessionSummary(s,depleted,lastRound)}function showSessionSummary(s,depleted,last){const rounds=s.rounds,avg=rounds.length?rounds.reduce((a,r)=>a+r.score/r.answers.length*20,0)/rounds.length:0;label.textContent='Session complete';view.innerHTML=`<section class="card"><h1>${depleted?'Question bank complete':'Session finished'}</h1><p>${rounds.length} submitted round(s) · Average ${rounds.length?avg.toFixed(1):'n/a'} / 20</p><p>Your session is saved in history.</p><button class="primary" id="home">Overall dashboard</button> <button id="again">Start another session</button></section>`;document.querySelector('#home').onclick=renderHome;document.querySelector('#again').onclick=startSession}
function renderHome(){label.textContent='';const active=mem.activeSession,history=mem.history,roundData=history.flatMap(s=>(s.rounds||[]).filter(Boolean)),mastery=Object.fromEntries(TOPICS.map(t=>[t,{ok:0,n:0}]));for(const r of roundData)for(const a of r.answers||[])if(a.topic&&mastery[a.topic]){mastery[a.topic].n++;if(a.correct)mastery[a.topic].ok++}const scores=roundData.map(r=>r.answers?.length?100*r.score/r.answers.length:null).filter(x=>x!==null),trend=scores.length?`<svg viewBox="0 0 700 150" role="img" aria-label="Score trend across completed rounds"><title>Score trend across completed rounds</title><polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${scores.map((v,i)=>`${scores.length===1?350:30+i*640/(scores.length-1)},${130-v*1.1}`).join(' ')}"/>${scores.map((v,i)=>`<circle cx="${scores.length===1?350:30+i*640/(scores.length-1)}" cy="${130-v*1.1}" r="4" fill="var(--accent)"><title>Round ${i+1}: ${v.toFixed(0)}%</title></circle>`).join('')}<text x="8" y="20" fill="currentColor">100%</text><text x="8" y="132" fill="currentColor">0%</text></svg>`:'<p class="muted">No completed rounds yet.</p>';view.innerHTML=`<section class="card"><h1>Python Revision Test</h1><p>Offline multiple-choice practice from your notes. Each round has up to 20 questions.</p>${active?`<p>Active session: ${active.rounds.length} round(s) submitted.</p><button class="primary" id="resume">Resume session</button>`:`<button class="primary" id="start">Start round 1</button>`} <h2>Overall dashboard</h2><p>Rounds completed: ${roundData.length} · Sessions finished: ${history.length}</p><h3>Score trend by round</h3>${trend}<h3>Topic mastery</h3><ul>${TOPICS.map(t=>{const x=mastery[t],p=x.n?x.ok/x.n:null,status=p===null?'not tested':p>=.8?'strong':p>=.5?'improving':'weak';return `<li>${esc(t)}: ${p===null?status:`${Math.round(p*100)}% (${x.n} attempts) · ${status}`}</li>`}).join('')}</ul></section>`;if(active)document.querySelector('#resume').onclick=renderQuiz;else document.querySelector('#start').onclick=startSession}load();if(mem.activeSession)renderQuiz();else renderHome();
})();
</script></body></html>
