const topics=[...new Set(bank.map(x=>x.t))], storageKey='mcq-python-progress';let state={rounds:[],wrongTopics:[],current:null};try{state=Object.assign(state,JSON.parse(localStorage.getItem(storageKey)||'{}'))}catch{}
const view=document.querySelector('#view'), label=document.querySelector('#roundLabel');function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dashboard(){const scores=state.rounds.map(r=>`${r.score}/20`).join(' · ')||'No rounds yet';const mastery=topics.map(t=>{const relevant=state.rounds.flatMap(r=>r.answers.filter(a=>a.topic===t));let p=relevant.length?relevant.filter(a=>a.ok).length/relevant.length:0;return `<li>${esc(t)}: ${!relevant.length?'not tested':p>=.8?'strong':p>=.5?'improving':'weak'}</li>`}).join('');view.innerHTML=`<section class="card"><h1>Python Revision Test</h1><p>20 multiple-choice questions per round · 1 mark each · no negative marking</p><p><b>Rounds completed:</b> ${state.rounds.length}<br><b>Score trend:</b> ${scores}</p><h2>Topic mastery</h2><ul>${mastery}</ul><button class="primary" id="start">${state.rounds.length?'Start next round':'Start round 1'}</button> <button id="finish">I'm satisfied / finish</button></section>`;document.querySelector('#start').onclick=startRound;document.querySelector('#finish').onclick=()=>{view.innerHTML='<section class="card"><h1>Test finished</h1><p>Your progress is saved on this device when storage is available.</p><button id="dash">View dashboard</button></section>';document.querySelector('#dash').onclick=dashboard}}
function startRound(){let selected;if(!state.rounds.length){let first=topics.map(t=>shuffle(bank.filter(q=>q.t===t))[0]);selected=shuffle(first).slice(0,20)}else{let weak=state.wrongTopics;let focused=bank.filter(q=>weak.includes(q.t));let fresh=bank.filter(q=>!weak.includes(q.t));selected=shuffle(focused).slice(0,14).concat(shuffle(fresh).slice(0,6));if(selected.length<20)selected=selected.concat(shuffle(bank.filter(q=>!selected.includes(q))).slice(0,20-selected.length))}state.current={questions:shuffle(selected).map(q=>{let pairs=shuffle(q.o.map((v,i)=>({v,correct:i===q.a})));return {...q,o:pairs.map(x=>x.v),a:pairs.findIndex(x=>x.correct),chosen:null}}),index:0,answers:[]};save();renderQ()}
function renderQ(){const c=state.current,i=c.index,q=c.questions[i];label.textContent=`Round ${state.rounds.length+1}`;view.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><span class="tag">${esc(q.t)}</span><span>Score ${c.answers.filter(a=>a.ok).length} / ${i}</span></div><p>Question ${i+1} of 20</p><progress max="20" value="${i}"></progress><h2>${esc(q.q).replace(/\n/g,'<br>')}</h2>${q.c?`<pre><code>${esc(q.c)}</code></pre>`:''}<div id="opts">${q.o.map((x,n)=>`<button class="option" data-n="${n}">${n+1}. ${'ABCD'[n]}. ${esc(x)}</button>`).join('')}</div><div id="feedback"></div></section>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(+b.dataset.n));window.onkeydown=e=>{if('1234'.includes(e.key))answer(+e.key-1);else if(/^[a-d]$/i.test(e.key))answer(e.key.toUpperCase().charCodeAt(0)-65);else if(e.key==='Enter'&&document.querySelector('#next'))document.querySelector('#next').click()}}
function answer(n){let q=state.current.questions[state.current.index];if(q.chosen!==null)return;q.chosen=n;const ok=n===q.a;state.current.answers.push({topic:q.t,ok,q:q.q,correct:q.o[q.a],explanation:q.e});if(!ok&&!state.wrongTopics.includes(q.t))state.wrongTopics.push(q.t);save();document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');else if(i===n)b.classList.add('wrong')});document.querySelector('#feedback').innerHTML=`<p class="${ok?'tag':'muted'}"><b>${ok?'Correct':'Incorrect'}.</b> ${esc(q.e)}</p><button class="primary" id="next">${state.current.index===19?'Round results':'Next question'}</button>`;document.querySelector('#next').onclick=nextQ}
function nextQ(){if(state.current.index<19){state.current.index++;save();renderQ();return}const c=state.current,score=c.answers.filter(a=>a.ok).length;state.rounds.push({score,answers:c.answers});state.wrongTopics=[...new Set(c.answers.filter(a=>!a.ok).map(a=>a.topic))];state.current=null;save();results(c.answers,score)}
function results(answers,score){const groups={};answers.forEach(a=>(groups[a.topic]??={n:0,ok:0}).n++,answers.filter(a=>a.topic===answers[0]?.topic));answers.forEach(a=>{groups[a.topic].ok+=a.ok?1:0});const breakdown=Object.entries(groups).map(([t,x])=>`<li>${esc(t)}: ${x.ok}/${x.n}</li>`).join('');const wrong=answers.filter(a=>!a.ok).map(a=>`<li><b>${esc(a.topic)}:</b> ${esc(a.q)}<br>Correct answer: ${esc(a.correct)}<br>${esc(a.explanation)}</li>`).join('')||'<li>None — perfect round.</li>';view.innerHTML=`<section class="card"><h1>Round ${state.rounds.length} results</h1><h2>${score} / 20 · ${Math.round(score/20*100)}%</h2><h3>Topic breakdown</h3><ul>${breakdown}</ul><h3>Questions to review</h3><ol>${wrong}</ol><button class="primary" id="nextRound">Start next round</button> <button id="finish">I'm satisfied / finish</button> <button id="dash">Overall dashboard</button></section>`;document.querySelector('#nextRound').onclick=startRound;document.querySelector('#dash').onclick=dashboard;document.querySelector('#finish').onclick=dashboard}
dashboard();
</script></body></html>
