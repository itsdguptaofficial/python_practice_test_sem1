</style></head><body><main><div class="toolbar"><div><span class="tag">PYTHON PRACTICE</span><h1>Revision tests</h1><p class="muted">Offline practice and progress from the supplied Python notes.</p></div><div class="toolbar"><label>Theme <select id="theme" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><button id="export">Export data</button><button id="import">Import data</button><input id="file" type="file" accept="application/json" hidden></div></div><p id="notice" class="notice hide" role="status"></p><section class="card"><p class="tag">Python · 19 topics</p><h2>Python Revision Test</h2><p>125-question bank, with 20-question rounds, explanations, progress, and adaptive review.</p><a class="button" href="tests/python.html">Start test</a></section><section id="stats"></section></main>

(()=>{'use strict';const KEY='mcq-python-progress',SETKEY='mcq-shared-settings',VERSION=2,topics=[...new Set((window.PYTHON_BANK||[]).map(q=>q.t))];let data=null,storageOK=true,settings={theme:'system'};const root=document.querySelector('#stats'),notice=document.querySelector('#notice');function read(k){try{return localStorage.getItem(k)}catch{storageOK=false;return null}}function applyTheme(){document.documentElement.dataset.theme=settings.theme;document.querySelector('#theme').value=settings.theme}function setTheme(t){settings.theme=t;try{localStorage.setItem(SETKEY,JSON.stringify(settings))}catch{showNotice('Storage is unavailable; theme will not persist.')}applyTheme()}function showNotice(t){notice.textContent=t;notice.classList.remove('hide')}function migrate(x){if(!x||typeof x!=='object')return {version:VERSION,activeSession:null,history:[]};if(x.version===VERSION&&Array.isArray(x.history))return {version:VERSION,activeSession:x.activeSession||null,history:x.history.filter(s=>s&&typeof s==='object'&&Array.isArray(s.rounds))};if(Array.isArray(x.rounds))return {version:VERSION,activeSession:null,history:[{id:'legacy',startedAt:null,endedAt:null,rounds:x.rounds.map(r=>({score:r.score,startedAt:null,endedAt:null,answers:(r.answers||[]).map(a=>({id:null,topic:a.topic||null,correct:typeof a.correct==='boolean'?a.correct:typeof a.ok==='boolean'?a.ok:undefined,changedCount:null,answeredAt:null,question:a.question||a.q||'',correctAnswer:a.correctAnswer||a.correct||'',explanation:a.explanation||''}))}))}]};return {version:VERSION,activeSession:null,history:[]}}function init(){let raw=read(KEY);if(raw){try{data=migrate(JSON.parse(raw))}catch{data={version:VERSION,activeSession:null,history:[]};showNotice('Saved test data is corrupt or unreadable. Start a test to create new progress.')}}else data={version:VERSION,activeSession:null,history:[]};let s=read(SETKEY);if(s)try{const x=JSON.parse(s);if(['system','light','dark'].includes(x.theme))settings=x}catch{}applyTheme();if document.querySelector('#theme').onchange=e=>setTheme(e.target.value);let filter='all',sort='date',chartMode='round';function dateOf(s){const d=s.endedAt||s.date||null;return d&&Number.isFinite(Date.parse(d))?new Date(d):null}function inRange(s){if(filter==='all')return true;const d=dateOf(s);if(!d)return false;const days=filter==='7'?7:30;return Date.now()-d.getTime()<=days*86400000&&d.getTime()<=Date.now()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtDate(d){return d?d.toLocaleDateString():'n/a'}function dur(ms){if(!Number.isFinite(ms)||ms<0)return 'n/a';const m=Math.round(ms/60000);return m<60?`${m} min`:`${Math.floor(m/60)}h ${m%60}m`}function roundsOf(s){return Array.isArray(s.rounds)?s.rounds.filter(r=>r&&typeof r==='object'):[]}function answersOf(r){return Array.isArray(r.answers)?r.answers.filter(a=>a&&typeof a==='object'):[]}function score20(r){if(typeof r.score==='number'&&Number.isFinite(r.score)){const n=answersOf(r).length;return n&&n!==20?r.score/n*20:r.score}const as=answersOf(r);if(as.some(a=>typeof a.correct!=='boolean'))return null;return as.length?as.filter(a=>a.correct).length/as.length*20:null}function svgChart(title,values,labels){if(!values.length)return `<p class="muted">No score data yet.</p>`;const W=760,H=220,L=40,R=15,T=18,B=42,innerW=W-L-R,innerH=H-T-B,pts=values.map((v,i)=>({x:L+(values.length===1?innerW/2:i*innerW/(values.length-1)),y:T+innerH-(Math.max(0,Math.min(20,v))/20)*innerH,v}));const lines=[0,5,10,15,20].map(n=>{const y=T+innerH-n/20*innerH;return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="currentColor" opacity=".18"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="currentColor" font-size="11">${n}</text>`}).join(''),dots=pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="var(--accent)"><title>${esc(labels[i])}: ${p.v.toFixed(1)} / 20</title></circle><text x="${p.x}" y="${H-15}" text-anchor="middle" fill="currentColor" font-size="10">${esc(labels[i]).slice(0,10)}</text>`).join(''),poly=pts.map(p=>`${p.x},${p.y}`).join(' ');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>${lines}<polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="3"/>${dots}</svg>`}function render(){if(!storageOK){root.innerHTML='<section class="card"><h2>Statistics unavailable</h2><p>Browser storage is blocked, so this page cannot read saved test progress.</p></section>';return}const sessions=data.history.filter(inRange),rounds=sessions.flatMap(roundsOf),answers=rounds.flatMap(answersOf),validAccuracy=answers.filter(a=>typeof a.correct==='boolean'),correct=validAccuracy.filter(a=>a.correct).length,overall=validAccuracy.length===answers.length&&validAccuracy.length?`${Math.round(correct/validAccuracy.length*100)}%`:'n/a',vals=rounds.map(score20),validScores=vals.filter(v=>v!==null),avg=validScores.length?`${(validScores.reduce((a,b)=>a+b,0)/validScores.length).toFixed(1)} / 20`:'n/a',best=validScores.length?`${Math.max(...validScores).toFixed(1)} / 20`:'n/a',worst=validScores.length?`${Math.min(...validScores).toFixed(1)} / 20`:'n/a',durations=sessions.map(s=>{const a=Date.parse(s.startedAt),b=Date.parse(s.endedAt);return Number.isFinite(a)&&Number.isFinite(b)?b-a:null}),validDur=durations.filter(x=>x!==null),totalTime=validDur.length===sessions.length&&sessions.length?dur(validDur.reduce((a,b)=>a+b,0)):'n/a',avgQ=validDur.length===sessions.length&&sessions.length&&answers.length?dur(validDur.reduce((a,b)=>a+b,0)/answers.length):'n/a',dates=[...new Set(sessions.map(s=>{const d=dateOf(s);return d?d.toISOString().slice(0,10):null}).filter(Boolean))].sort().reverse(),last=dates[0]||null;let streak='n/a';if(dates.length){let count=0,d=new Date();d.setHours(0,0,0,0);let cursor=new Date(d);if(!dates.includes(cursor.toISOString().slice(0,10)))cursor.setDate(cursor.getDate()-1);while(dates.includes(cursor.toISOString().slice(0,10))){count++;cursor.setDate(cursor.getDate()-1)}streak=`${count} day${count===1?'':'s'}`}
const active=data.activeSession,topAcc=Object.fromEntries(topics.map(t=>[t,{ok:0,n:0,attempts:0}]));for(const a of answers)if(a.topic&&topAcc[a.topic]){topAcc[a.topic].attempts++;if(typeof a.correct==='boolean'){topAcc[a.topic].n++;if(a.correct)topAcc[a.topic].ok++}}const ordered=topics.map(t=>({t,...topAcc[t]})).sort((a,b)=>{const ap=a.attempts&&a.n===a.attempts?a.ok/a.n:a.attempts?-.5:-1,bp=b.attempts&&b.n===b.attempts?b.ok/b.n:b.attempts?-.5:-1;return ap-bp}),weak=ordered.filter(x=>x.attempts&&x.n===x.attempts).slice(0,3),weakHtml=weak.length?`<p class="weak"><b>Weakest 3 topics:</b> ${weak.map(x=>`${esc(x.t)} (${Math.round(x.ok/x.n*100)}%)`).join(' · ')}</p>`:'<p class="muted">Weakest topics appear after you answer questions.</p>',topicHtml=ordered.map(x=>`<div><div class="row"><span>${esc(x.t)}</span><span>${x.attempts?(x.n===x.attempts?`${Math.round(x.ok/x.n*100)}% · ${x.attempts} attempts`:`n/a · ${x.attempts} attempts`):'not tested'}</span></div>${x.attempts&&x.n===x.attempts?`<div class="bar"><i style="width:${x.ok/x.n*100}%"></i></div>`:''}</div>`).join('');
let trendRounds=rounds.map((r,i)=>({score:score20(r),label:`R${i+1}`})).filter(x=>x.score!==null),sessionAvgs=sessions.map((s,i)=>{const rs=roundsOf(s).map(score20).filter(x=>x!==null);return {score:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,label:`S${i+1}`}}).filter(x=>x.score!==null);const chartValues=chartMode==='round'?trendRounds:sessionAvgs;
const rows=sessions.map((s,i)=>{const rs=roundsOf(s),as=rs.flatMap(answersOf),sv=rs.map(score20).filter(x=>x!==null),average=sv.length?sv.reduce((a,b)=>a+b,0)/sv.length:null,ds=dateOf(s),start=Date.parse(s.startedAt),end=Date.parse(s.endedAt),duration=Number.isFinite(start)&&Number.isFinite(end)?end-start:null;return {s,i,rs,as,sv,average,ds,duration}}).sort((a,b)=>sort==='date'?(b.ds?.getTime()||0)-(a.ds?.getTime()||0):(b.average??-1)-(a.average??-1));const historyHtml=rows.length?rows.map(({s,i,rs,as,sv,average,ds,duration})=>{const tb={};as.forEach(a=>{if(a.topic){tb[a.topic]??={ok:0,n:0,attempts:0};tb[a.topic].attempts++;if(typeof a.correct==='boolean'){tb[a.topic].n++;if(a.correct)tb[a.topic].ok++}}});const misses=as.filter(a=>a.correct===false);return `<tr data-history="${i}" tabindex="0" role="button" aria-expanded="false"><td>${fmtDate(ds)}</td><td>${rs.length}</td><td>${as.length}</td><td>${average===null?'n/a':average.toFixed(1)+' / 20'}</td><td>${sv.length?Math.max(...sv).toFixed(1)+' / 20':'n/a'}</td><td>${duration===null?'n/a':dur(duration)}</td></tr><tr class="detail hide" id="detail-${i}"><td colspan="6"><b>Round scores:</b> ${sv.map(v=>`${v.toFixed(1)}/20`).join(', ')||'n/a'}<br><b>Topic breakdown:</b> ${Object.entries(tb).map(([t,x])=>`${esc(t)} ${x.n===x.attempts?`${x.ok}/${x.n}`:`n/a (${x.attempts} attempts)`}`).join(' · ')||'n/a'}<br><b>Missed questions:</b><ul>${misses.map(a=>`<li>${esc(a.question||'Question text unavailable')} — ${esc(a.topic||'Topic unavailable')} (correct: ${esc(a.correctAnswer||'n/a')})</li>`).join('')||'<li>None recorded</li>'}</ul></td></tr>`}).join(''):'<tr><td colspan="6">No sessions in this time range.</td></tr>';
const missed={};for(const a of answers)if(a.correct===false){const id=a.id||a.question||'legacy-unknown';missed[id]??={q:a.question||'Question text unavailable',t:a.topic||'Topic unavailable',n:0};missed[id].n++}const topMiss=Object.values(missed).sort((a,b)=>b.n-a.n).slice(0,5),changed=answers.filter(a=>typeof a.changedCount==='number'),changeShare=changed.length===answers.length&&changed.length?`${Math.round(changed.filter(a=>a.changedCount>0).length/changed.length*100)}% (${changed.filter(a=>a.changedCount>0).length}/${changed.length})`:'n/a';let empty=!sessions.length&&!active;
root.innerHTML=`<div class="toolbar"><label>Period <select id="period"><option value="all" ${filter==='all'?'selected':''}>All time</option><option value="7" ${filter==='7'?'selected':''}>Last 7 days</option><option value="30" ${filter==='30'?'selected':''}>Last 30 days</option></select></label></div>${!sessions.length&&!active?'<section class="card"><p>No sessions yet. Start your first test.</p></section>':''}${active?`<section class="card"><h2>Active session</h2><p>Round ${roundsOf(active).length+1} · ${active.usedQuestionIds?.length||0} questions used · ${Math.max(0,(window.PYTHON_BANK||[]).length-(active.usedQuestionIds?.length||0))} questions remaining in the bank</p><a class="button" href="tests/python">Resume</a></section>`:''}<section class="card"><h2>Overview</h2><div class="grid"><div class="stat"><b>${sessions.length}</b>Sessions completed</div><div class="stat"><b>${rounds.length}</b>Rounds played</div><div class="stat"><b>${answers.length}</b>Questions answered</div><div class="stat"><b>${overall}</b>Overall accuracy</div><div class="stat"><b>${avg}</b>Average round score</div><div class="stat"><b>${best}</b>Best round</div><div class="stat"><b>${worst}</b>Worst round</div><div class="stat"><b>${totalTime}</b>Total practice time</div><div class="stat"><b>${avgQ}</b>Average time per question</div><div class="stat"><b>${streak}</b>Practice streak</div><div class="stat"><b>${last||'n/a'}</b>Last session</div></div></section><section class="card"><div class="row"><h2>Score trend</h2><div class="trend-controls"><button id="chartRound" aria-pressed="${chartMode==='round'}">Rounds</button><button id="chartSession" aria-pressed="${chartMode==='session'}">Sessions</button></div></div>${svgChart(chartMode==='round'?'Round scores out of 20':'Average score per session out of 20',chartValues.map(x=>x.score),chartValues.map(x=>x.label))}</section><section class="card"><h2>Topic mastery</h2>${weakHtml}<div class="grid">${topicHtml}</div></section><section class="card"
